<style>
:root{
  --primary:#7A2E1F;
  --primary-dark:#5A2015;
  --gold:#B8873B;
  --gold-dark:#96692A;
  --accent:#B8873B;
  --accent-dark:#96692A;
  --bg:#F6EFE2;
  --card:#FFFDF9;
  --text:#2B2016;
  --muted:#7C7062;
  --border:#E4D9C4;
  --danger:#B3261E;
  --danger-bg:#FBEAE8;
  --green:#2E6B45;
  --green-bg:#E7F3EA;
  --radius:10px;
  --shadow:0 2px 6px rgba(43,32,22,.09), 0 1px 2px rgba(43,32,22,.07);
  --shadow-lg:0 14px 32px rgba(43,32,22,.22);
  --font-display:Georgia,"Times New Roman",serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:15px;}

/* ---------- layout ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
  color:#fff;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  border-bottom:3px solid var(--gold);
  box-shadow:var(--shadow);
}
.topbar .brand{
  display:flex;align-items:center;gap:10px;
  font-family:var(--font-display);
  font-weight:700;font-size:21px;letter-spacing:.02em;
}
.topbar .brand small{
  display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-weight:600;font-size:10.5px;opacity:.88;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;
}
.brand-logo-sm{
  width:38px;height:38px;border-radius:50%;object-fit:cover;
  border:2px solid var(--gold);background:#fff;flex-shrink:0;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.brand-logo{
  display:block;width:96px;height:96px;border-radius:50%;object-fit:cover;
  margin:0 auto 14px;border:3px solid var(--gold);box-shadow:var(--shadow);
}
.topbar .who{display:flex;align-items:center;gap:12px;font-size:13px;}
.topbar .who .pill{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:600;
  padding:5px 12px;border-radius:20px;
}
.topbar button.logout{
  background:rgba(0,0,0,.2);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
}
.topbar button.logout:hover{background:rgba(0,0,0,.34);}

nav.tabs{
  display:flex;
  gap:2px;
  background:var(--primary-dark);
  padding:0 14px;
  overflow-x:auto;
}
nav.tabs button{
  background:transparent;border:none;color:#fff;opacity:.78;
  padding:13px 16px;font-size:13.5px;font-weight:600;white-space:nowrap;
  letter-spacing:.02em;
  border-bottom:3px solid transparent;
  transition:opacity .15s, background .15s;
}
nav.tabs button.active{opacity:1;border-bottom-color:var(--gold);background:rgba(255,255,255,.06);}
nav.tabs button:hover{opacity:1;background:rgba(255,255,255,.05);}

main{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%;}

footer.app-footer{
  text-align:center;font-size:11.5px;color:var(--muted);padding:16px;
  letter-spacing:.03em;
}

/* ---------- cards / sections ---------- */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-top:3px solid var(--gold);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.card h2{margin:0 0 12px;font-size:17px;font-weight:700;font-family:var(--font-display);color:var(--primary);}

<script>
/* ===== CONFIGURAÇÃO DO FIREBASE (projeto gama-chips) =====
   Firebase → Visão geral → app Web → copie o firebaseConfig e cole aqui. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyASo0A4ymprSOLc24O9CAMHjPwdLYeazXQ",
  authDomain: "gama-chips.firebaseapp.com",
  projectId: "gama-chips",

<script>
/* =========================================================================
   GAMA CHIPS - SISTEMA ONLINE (GitHub Pages + Firebase)
   - Login: Firebase Authentication (e-mail e senha). Os logins são criados
     no console (Authentication → Usuários); quem digitar só o nome (ex.:
     "joao") entra como joao@gamachips.app.
   - Administradores fixos: lista ADMINS abaixo (e a mesma lista nas regras).
     Os demais são liberados na aba Usuários do sistema (perfil + ativo).
   - Dados: Cloud Firestore, uma coleção por "store" (produtos, vendas...).
     O app mantém um cache em memória sincronizado em tempo real
     (onSnapshot), então as telas continuam usando dbGetAll/dbGet/dbPut.
   - Funciona com internet instável: o Firestore guarda as gravações no
     navegador e envia quando a conexão volta.
   ========================================================================= */

const DB_NAME = "gamachips-db";
const DB_VERSION = 4;
const STORES = ["usuarios", "produtos", "vendas", "contasFixas", "balancetesMeta", "congeladosFaixas", "config", "historicoCompras", "movimentosEstoque", "acaiTamanhos"];
const ML_POR_LITRO = 1000;

let db = null;
let state = {
  user: null,        // usuário logado {id, nome, perfil}
  view: "dashboard",
  cart: [],          // itens da venda em andamento no PDV
  pdvCategoria: null,
  pdvPagamento: { forma: "dinheiro", parcelas: 2 },
  hist: null,        // filtro da tela Histórico de Vendas
  relatorio: null     // filtro da tela Relatório (movimentação de estoque)
};

/* ---------------------------------------------------------------------
   IndexedDB - camada de acesso
--------------------------------------------------------------------- */
/* ---- Firebase ---- */
const EMAIL_DOMINIO = "gamachips.app";
const ADMINS = ["gerencia@zirannordeste.com.br", "admin@gamachips.app"]; // manter igual às regras
const KEYPATH = { balancetesMeta: "mes", config: "id" }; // demais stores usam "id"
KEYPATH.usuarios = "email";
const AUTO_ID = new Set(STORES.filter(st => !KEYPATH[st]));
let fbApp = null, fbAuth = null, fs = null;
const cache = {};          // store -> Map(docId -> objeto)
let unsubs = [];

function initFirebase() {
  if (typeof firebase === "undefined") throw new Error("Sem internet: não foi possível carregar o Firebase.");
  if (!FIREBASE_CONFIG || String(FIREBASE_CONFIG.apiKey).includes("COLE_AQUI")) {
    throw new Error("Falta colar o firebaseConfig no index.html (procure por COLE_AQUI).");
  }
  fbApp = firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth = firebase.auth();
  fs = firebase.firestore();
  fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
}

function loginToEmail(login) {
  login = String(login || "").trim().toLowerCase();
  if (login.includes("@")) return login;
  const slug = String(login || "").trim().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9._-]+/g, ".").replace(/^\.+|\.+$/g, "");
  return slug ? `${slug}@${EMAIL_DOMINIO}` : "";
}

function keyOf(store, obj) { return obj[KEYPATH[store] || "id"]; }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function novoId() { return Date.now() * 100 + Math.floor(Math.random() * 100); }
function avisarErroGravacao(err) {
  console.error(err);
  showToast("Erro ao salvar na nuvem: " + (err.code === "permission-denied" ? "sem permissão" : err.message), "err");
}

// Abre a sincronização em tempo real de todas as coleções e resolve quando
// a primeira leitura de cada uma chegou.
function startSync() {
  stopSync();
  return Promise.all(STORES.map(store => new Promise((resolve) => {
    cache[store] = new Map();
    let first = true;
    const un = fs.collection(store).onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === "removed") cache[store].delete(ch.doc.id);
        else cache[store].set(ch.doc.id, ch.doc.data());
      });
      if (first) { first = false; resolve(); }
    }, err => { console.warn("sync", store, err.code); cache[store] = cache[store] || new Map(); if (first) { first = false; resolve(); } });
    unsubs.push(un);
  })));
}
function stopSync() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; }

function sortByKey(a, b) {
  const ka = a.id ?? a.mes ?? a.email, kb = b.id ?? b.mes ?? b.email;
  if (typeof ka === "number" && typeof kb === "number") return ka - kb;
  return String(ka).localeCompare(String(kb));
}
async function dbGetAll(storeName) {
  const m = cache[storeName];
  return m ? [...m.values()].map(clone).sort(sortByKey) : [];
}
async function dbGet(storeName, key) {
  const m = cache[storeName];
  return m ? clone(m.get(String(key))) : undefined;
}
async function dbPut(storeName, value) {
  const v = clone(value);
  const kp = KEYPATH[storeName] || "id";
  if (v[kp] == null) {
    if (!AUTO_ID.has(storeName)) throw new Error("Registro sem chave em " + storeName);
    v[kp] = novoId();
  }
  const key = v[kp];
  if (!cache[storeName]) cache[storeName] = new Map();
  cache[storeName].set(String(key), v);
  // não espera o servidor: com internet ruim a gravação fica na fila e sobe depois
  fs.collection(storeName).doc(String(key)).set(v).catch(avisarErroGravacao);
  return key;
}
async function dbDelete(storeName, key) {
  if (cache[storeName]) cache[storeName].delete(String(key));
  fs.collection(storeName).doc(String(key)).delete().catch(avisarErroGravacao);
}
async function dbClear(storeName) {
  const snap = await fs.collection(storeName).get();
  for (let i = 0; i < snap.docs.length; i += 400) {
    const batch = fs.batch();
    snap.docs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
  cache[storeName] = new Map();
}
// gravação em lote (usada na importação de backup) — espera o servidor
async function dbBulkPut(storeName, items) {
  const kp = KEYPATH[storeName] || "id";
  for (let i = 0; i < items.length; i += 400) {
    const batch = fs.batch();
    items.slice(i, i + 400).forEach(it => {
      const v = clone(it);
      if (v[kp] == null) v[kp] = novoId();
      batch.set(fs.collection(storeName).doc(String(v[kp])), v);
      cache[storeName].set(String(v[kp]), v);
    });
    await batch.commit();
  }
}

// Registra uma linha no livro de movimentação de estoque (kardex): toda
// entrada (compra) ou saída (venda/perda) de qualquer item passa por aqui.
function logMovimento(m) {
  return dbPut("movimentosEstoque", {
    data: todayISO(),
    produtoId: m.produtoId ?? null,
    produtoNome: m.produtoNome,
    categoria: m.categoria || null,
    tipo: m.tipo, // "venda" | "compra" | "perda"
    quantidade: m.quantidade,
    unidade: m.unidade || "",
    valorUnitario: m.valorUnitario ?? null,
    valorTotal: m.valorTotal ?? null,
    estoqueAntes: m.estoqueAntes ?? null,
    estoqueDepois: m.estoqueDepois ?? null,
    formaPagamento: m.formaPagamento || null,
    parcelas: m.parcelas ?? null,
    motivo: m.motivo || null,
    usuarioNome: m.usuarioNome || (state.user ? state.user.nome : "")
  });
}

/* ---------------------------------------------------------------------
   Utilidades
--------------------------------------------------------------------- */
function fmtMoney(v) {
  v = Number(v) || 0;
  return "R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleDateString("pt-BR");
}
function fmtDateTime(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleDateString("pt-BR") + " " + dt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function todayISO() {
  return new Date().toISOString();
}
function monthKey(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0");
}
function monthLabel(mk) {
  const [y, m] = mk.split("-");
  const nomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  return nomes[parseInt(m, 10) - 1] + " de " + y;
}
function uid() { return Math.random().toString(36).slice(2, 10); }

// Açaí é controlado internamente em ml (precisão), mas exibido em litros.
function formatEstoqueValor(v, categoria) {
  if (v == null) return "—";
  if (categoria === "acai") return (v / ML_POR_LITRO).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " L";
  return v;
}
function formatCustoProduto(p) {
  if (p.precoCusto == null) return "—";
  if (p.categoria === "acai") return fmtMoney(p.precoCusto * ML_POR_LITRO) + "/L";
  return fmtMoney(p.precoCusto);
}

async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function showToast(msg, type = "ok") {
  const area = document.getElementById("toast-area");
  const el = document.createElement("div");
  el.className = "toast toast-" + type;
  el.textContent = msg;
  area.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3200);
}

function openModal(html) {
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").classList.remove("hidden");
}
function closeModal() {
  document.getElementById("modal-overlay").classList.add("hidden");
  document.getElementById("modal-box").innerHTML = "";
}
function confirmDialog(message, onYes) {
  openModal(`
    <h2>Confirmar</h2>
    <p>${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="md-no">Cancelar</button>
      <button class="btn btn-danger" id="md-yes">Confirmar</button>
    </div>
  `);
  document.getElementById("md-no").onclick = closeModal;
  document.getElementById("md-yes").onclick = () => { closeModal(); onYes(); };
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------------------------------------------------------------------
   Gráficos simples (HTML/CSS, sem bibliotecas externas)
--------------------------------------------------------------------- */
function renderStockBarChart(container, produtos, valueFmt) {
  const itens = produtos.filter(p => p.estoqueAtual !== null);
  if (itens.length === 0) { container.innerHTML = `<p class="empty-state small">Sem dados.</p>`; return; }
  const fmt = valueFmt || ((v, unidade) => v + (unidade ? " " + unidade : ""));
  const max = Math.max(...itens.map(p => p.estoqueAtual), 1);
  container.innerHTML = `<div class="hbar-chart">` + itens.map(p => {
    const pct = Math.max(2, Math.round((p.estoqueAtual / max) * 100));
    const low = p.estoqueMinimo !== null && p.estoqueAtual <= p.estoqueMinimo;
    return `
      <div class="hbar-row">
        <div class="hbar-label" title="${escapeHtml(p.nome)}">${escapeHtml(p.nome)}</div>
        <div class="hbar-track"><div class="hbar-fill ${low ? "low" : "ok"}" style="width:${pct}%" title="${escapeHtml(p.nome)}: ${fmt(p.estoqueAtual, p.unidade)}"></div></div>
        <div class="hbar-value">${fmt(p.estoqueAtual, p.unidade)}${low ? " ⚠" : ""}</div>
      </div>`;
  }).join("") + `</div>`;
}

function renderDailySalesChart(container, dataPoints, valueFmt) {
  if (!dataPoints || dataPoints.length === 0) { container.innerHTML = `<p class="empty-state">Sem dados para mostrar.</p>`; return; }
  const fmt = valueFmt || (v => fmtMoney(v));
  const max = Math.max(...dataPoints.map(d => d.value), 1);
  const showLabels = dataPoints.length <= 14;
  container.innerHTML = `<div class="vbar-chart">` + dataPoints.map(d => {
    const pct = Math.max(2, Math.round((d.value / max) * 100));
    return `
      <div class="vbar-col" title="${escapeHtml(d.label)}: ${fmt(d.value)}">
        <div class="vbar-track"><div class="vbar-fill" style="height:${pct}%"></div></div>
        ${showLabels ? `<div class="vbar-label">${escapeHtml(d.label)}</div>` : ""}
      </div>`;
  }).join("") + `</div>`;
}

async function seedInitialData() {
  for (const p of SEED_PRODUTOS) await dbPut("produtos", p);
  for (const f of SEED_FAIXAS_CONGELADOS) await dbPut("congeladosFaixas", f);
  for (const t of SEED_ACAI_TAMANHOS) await dbPut("acaiTamanhos", t);
  await dbPut("config", { id: "app", empresa: "Gama Chips", criadoEm: todayISO(), migV4Applied: true, migV5Applied: true });
}

// Ajusta instalações que já existiam antes do estoque de Açaí/Assados existir:
// liga o controle de estoque desses itens sem apagar nada que já foi lançado.
async function migrateV4() {
  const cfg = (await dbGet("config", "app")) || { id: "app" };
  if (cfg.migV4Applied) return;

  const produtos = await dbGetAll("produtos");

  for (const p of produtos.filter(p => p.categoria === "assado" && p.estoqueAtual === null)) {
    p.estoqueAtual = 0;
    p.estoqueMinimo = 5;
    await dbPut("produtos", p);
  }

  const acai = produtos.find(p => p.categoria === "acai");
  if (acai && acai.unidade !== "ml") {
    acai.nome = "Açaí";
    acai.unidade = "ml";
    acai.estoqueAtual = 0;
    acai.estoqueMinimo = 2000;
    acai.precoVenda = null;
    await dbPut("produtos", acai);
  } else if (!acai) {
    await dbPut("produtos", { categoria: "acai", nome: "Açaí", unidade: "ml", estoqueAtual: 0, estoqueMinimo: 2000, precoVenda: null, precoCusto: null, ativo: true });
  }

  const tamanhos = await dbGetAll("acaiTamanhos");
  if (tamanhos.length === 0) {
    for (const t of SEED_ACAI_TAMANHOS) await dbPut("acaiTamanhos", t);
  }

  cfg.migV4Applied = true;
  await dbPut("config", cfg);
}

// V5: junta o estoque de "Salgados Congelados" no estoque de salgados fritos.
// O cunhado compra tudo pronto e vende frito ou congelado do mesmo estoque.
async function migrateV5() {
  const cfg = (await dbGet("config", "app")) || { id: "app" };
  if (cfg.migV5Applied) return;
  const produtos = await dbGetAll("produtos");
  let salg = getProdutoSalgados(produtos);
  const congs = produtos.filter(p => p.categoria === "congelado" && !p.mergedInto);
  if (!salg) {
    const novo = { categoria: "salgado", nome: "Salgados (fritos + congelados)", unidade: "unidade", estoqueAtual: 0, estoqueMinimo: 500, precoVenda: 0.5, precoCusto: null, ativo: true };
    novo.id = await dbPut("produtos", novo);
    salg = novo;
  }
  for (const c of congs) {
    const qtd = Number(c.estoqueAtual) || 0;
    const antes = salg.estoqueAtual || 0;
    salg.estoqueAtual = antes + qtd;
    if (salg.precoCusto == null && c.precoCusto != null) salg.precoCusto = c.precoCusto;
    if (qtd > 0) {
      await logMovimento({
        produtoId: salg.id, produtoNome: "Salgados (fritos + congelados)", categoria: "salgado", tipo: "ajuste",
        quantidade: qtd, unidade: "unidade", estoqueAntes: antes, estoqueDepois: salg.estoqueAtual,
        motivo: `Unificação: estoque de "${c.nome}" somado ao estoque de salgados`, usuarioNome: "Sistema"
      });
    }
    c.estoqueAntesUnificacao = c.estoqueAtual;
    c.estoqueAtual = null;
    c.estoqueMinimo = null;
    c.ativo = false;
    c.mergedInto = salg.id;
    await dbPut("produtos", c);
  }
  salg.nome = "Salgados (fritos + congelados)";
  await dbPut("produtos", salg);
  cfg.migV5Applied = true;
  await dbPut("config", cfg);
}

        <h1>Gama Chips</h1>
        <p class="sub">Entre para lançar vendas e controlar o estoque</p>
        <form id="login-form">
          <div class="field"><label>Usuário ou e-mail</label><input type="text" id="lg-usuario" required autocapitalize="off" autocomplete="username" value="${escapeHtml(ultimo)}"></div>
          <div class="field"><label>Senha</label><input type="password" id="lg-senha" required autocomplete="current-password"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="lg-btn">Entrar</button>

    </div>

    e.preventDefault();
    const login = document.getElementById("lg-usuario").value.trim();
    const senha = document.getElementById("lg-senha").value;
    const btn = document.getElementById("lg-btn"); btn.disabled = true; btn.textContent = "Entrando...";
    try {
      await fbAuth.signInWithEmailAndPassword(loginToEmail(login), senha);
      try { localStorage.setItem("gc-ultimo-login", login); } catch (e2) {}
      // onAuthStateChanged continua a entrada
    } catch (err) {
      btn.disabled = false; btn.textContent = "Entrar";
      document.getElementById("login-err").textContent =
        (err.code === "auth/network-request-failed") ? "Sem internet. Verifique a conexão." :
        (err.code === "auth/too-many-requests") ? "Muitas tentativas. Aguarde alguns minutos." : "Usuário ou senha incorretos.";
    }
  });
}

function logout() {
  state.user = null;
  state.cart = [];
  state.view = "dashboard";
  stopSync();
  fbAuth.signOut();
}

/* ---------------------------------------------------------------------
   Dashboard
--------------------------------------------------------------------- */
async function renderDashboard() {
  const el = document.getElementById("main-content");
  const vendas = await dbGetAll("vendas");
  const hojeStr = new Date().toDateString();
  const vendasHoje = vendas.filter(v => new Date(v.dataHora).toDateString() === hojeStr);
  const totalHoje = vendasHoje.reduce((s, v) => s + v.total, 0);
  const mk = monthKey(new Date());
  const vendasMes = vendas.filter(v => monthKey(v.dataHora) === mk);
  const totalMes = vendasMes.reduce((s, v) => s + v.total, 0);

  const produtos = await dbGetAll("produtos");
  const baixos = produtos.filter(p => p.estoqueAtual !== null && p.estoqueMinimo !== null && p.estoqueAtual <= p.estoqueMinimo);

  el.innerHTML = `
    <div class="grid-3">
      <div class="stat"><div class="label">Vendas hoje</div><div class="value">${fmtMoney(totalHoje)}</div><div class="small muted">${vendasHoje.length} venda(s)</div></div>
      <div class="stat"><div class="label">Vendas em ${monthLabel(mk)}</div><div class="value">${fmtMoney(totalMes)}</div></div>
      <div class="stat ${baixos.length ? "alert" : ""}"><div class="label">Itens com estoque baixo</div><div class="value">${baixos.length}</div></div>
    </div>
    <div class="card">
      <div class="flex-between"><h2 class="mt-0 mb-0">Atalhos</h2></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn btn-primary btn-lg" id="go-pdv">Lançar Venda</button>
        ${state.user.perfil === "admin" ? `<button class="btn btn-secondary" id="go-estoque">Ver Estoque</button>
        <button class="btn btn-secondary" id="go-financeiro">Ver Financeiro</button>` : ""}
      </div>
    </div>
    ${baixos.length ? `
    <div class="card">
      <h2>Estoque baixo</h2>
      <table><thead><tr><th>Produto</th><th class="num">Estoque</th><th class="num">Mínimo</th></tr></thead>
      <tbody>${baixos.map(p => `<tr><td>${escapeHtml(p.nome)}</td><td class="num">${formatEstoqueValor(p.estoqueAtual, p.categoria)}</td><td class="num">${formatEstoqueValor(p.estoqueMinimo, p.categoria)}</td></tr>`).join("")}</tbody></table>
    </div>` : ""}
  `;
  document.getElementById("go-pdv").onclick = () => navigate("pdv");
  const ge = document.getElementById("go-estoque"); if (ge) ge.onclick = () => navigate("estoque");
  const gf = document.getElementById("go-financeiro"); if (gf) gf.onclick = () => navigate("financeiro");
}

/* ---------------------------------------------------------------------
   PDV - Lançar Venda
--------------------------------------------------------------------- */
async function renderPDV() {
  const el = document.getElementById("main-content");
  const produtos = (await dbGetAll("produtos")).filter(p => p.ativo !== false);
  const faixas = await dbGetAll("congeladosFaixas");
  const tamanhosAcai = await dbGetAll("acaiTamanhos");
  const categorias = ["salgado", "pacote", "bebida", "congelado", "assado", "acai", "outro"];

  el.innerHTML = `
    <div class="card">
      <h2>Nova venda</h2>
      <div class="cat-grid">
        ${categorias.map(c => `<button class="cat-btn ${state.pdvCategoria === c ? "active" : ""}" data-cat="${c}">${CATEGORIA_LABEL[c]}</button>`).join("")}
      </div>
      <div id="pdv-item-form"></div>
      <div class="cart" id="pdv-cart"></div>
    </div>
  `;
  document.querySelectorAll(".cat-btn").forEach(btn => {
    btn.onclick = () => { state.pdvCategoria = btn.dataset.cat; renderPDV(); };
  });
  renderPdvItemForm(produtos, faixas, tamanhosAcai);
  renderPdvCart();
}

function renderPdvItemForm(produtos, faixas, tamanhosAcai) {
  const wrap = document.getElementById("pdv-item-form");
  const cat = state.pdvCategoria;
  if (!cat) { wrap.innerHTML = `<p class="muted">Escolha uma categoria acima para adicionar um item à venda.</p>`; return; }

  if (cat === "outro") {
    wrap.innerHTML = `
      <div class="field-row">
        <div class="field"><label>Descrição</label><input id="pdv-outro-desc" placeholder="Ex: Combo promocional"></div>
        <div class="field" style="max-width:110px;"><label>Qtd.</label><input id="pdv-outro-qtd" type="number" min="1" value="1"></div>
        <div class="field" style="max-width:140px;"><label>Valor total (R$)</label><input id="pdv-outro-valor" type="number" min="0" step="0.01"></div>
      </div>
      <button class="btn btn-accent" id="pdv-add-outro">Adicionar à venda</button>
    `;
    document.getElementById("pdv-add-outro").onclick = () => {
      const desc = document.getElementById("pdv-outro-desc").value.trim() || "Outro item";
      const qtd = Number(document.getElementById("pdv-outro-qtd").value) || 1;
      const valor = Number(document.getElementById("pdv-outro-valor").value) || 0;
      state.cart.push({ produtoId: null, categoria: "outro", nome: desc, quantidade: qtd, precoUnit: valor / qtd, subtotal: valor });
      renderPdvCart();
      showToast("Item adicionado");
    };
    return;
  }

  if (cat === "congelado") {
    const produto = getProdutoSalgados(produtos);
    wrap.innerHTML = `
      <p class="small muted">Estoque único de salgados (fritos + congelados): <b>${produto ? produto.estoqueAtual : 0}</b> unidades · ${produto ? (produto.estoqueAtual / 100).toFixed(1) : 0} centos</p>
      <div class="field-row">
        <div class="field" style="max-width:140px;"><label>Quantidade (unid.)</label><input id="pdv-cong-qtd" type="number" min="1" value="100"></div>
        <div class="field" style="max-width:140px;"><label>Valor total (R$)</label><input id="pdv-cong-valor" type="number" min="0" step="0.01"></div>
        <div class="field"><button class="btn btn-secondary" id="pdv-cong-sugerir" type="button" style="margin-top:22px;">Sugerir preço</button></div>
      </div>
      <button class="btn btn-accent" id="pdv-add-cong">Adicionar à venda</button>
    `;
    document.getElementById("pdv-cong-sugerir").onclick = () => {
      const qtd = Number(document.getElementById("pdv-cong-qtd").value) || 0;
      const cento = qtd / 100;
      let faixa = [...faixas].sort((a, b) => a.quantidadeCento - b.quantidadeCento).reverse().find(f => cento >= f.quantidadeCento);
      if (!faixa) faixa = faixas[0];
      if (faixa) {
        const total = faixa.precoRevendaCento * cento;
        document.getElementById("pdv-cong-valor").value = total.toFixed(2);
        showToast(`Faixa ${faixa.quantidadeCento}+ cento: R$ ${faixa.precoRevendaCento}/cento`);
      }
    };
    document.getElementById("pdv-add-cong").onclick = () => {
      const qtd = Number(document.getElementById("pdv-cong-qtd").value) || 0;
      const valor = Number(document.getElementById("pdv-cong-valor").value) || 0;
      if (qtd <= 0) { showToast("Informe a quantidade", "err"); return; }
      if (produto && qtd > produto.estoqueAtual) showToast(`Atenção: estoque de salgados é ${produto.estoqueAtual}, venda segue mas confira o estoque.`, "err");
      state.cart.push({ produtoId: produto ? produto.id : null, categoria: "congelado", nome: "Salgados congelados", quantidade: qtd, precoUnit: valor / qtd, subtotal: valor });
      renderPdvCart();
      showToast("Item adicionado");
    };
    return;
  }

  if (cat === "acai") {
    const produto = produtos.find(p => p.categoria === "acai");
    const estoqueAtualMl = produto ? produto.estoqueAtual : 0;
    wrap.innerHTML = `
      <p class="small muted">Estoque atual: <b>${formatEstoqueValor(estoqueAtualMl, "acai")}</b></p>
      <div class="field-row">
        <div class="field"><label>Tamanho</label>
          <select id="pdv-acai-tam">${tamanhosAcai.map(t => `<option value="${t.id}">${escapeHtml(t.nome)} — ${fmtMoney(t.precoVenda)}</option>`).join("")}</select>
        </div>
        <div class="field" style="max-width:110px;"><label>Qtd. copos</label><input id="pdv-acai-qtd" type="number" min="1" value="1"></div>
        <div class="field" style="max-width:140px;"><label>Valor total (R$)</label><input id="pdv-acai-valor" type="number" min="0" step="0.01"></div>
      </div>
      <button class="btn btn-accent" id="pdv-add-acai">Adicionar à venda</button>
    `;
    if (tamanhosAcai.length === 0) {
      wrap.innerHTML = `<p class="empty-state">Nenhum tamanho de copo cadastrado ainda. Cadastre em Estoque → Açaí → Tamanhos.</p>`;
      return;
    }
    function syncAcaiValor() {
      const t = tamanhosAcai.find(x => x.id === Number(document.getElementById("pdv-acai-tam").value));
      const qtd = Number(document.getElementById("pdv-acai-qtd").value) || 0;
      if (t) document.getElementById("pdv-acai-valor").value = (qtd * t.precoVenda).toFixed(2);
    }
    document.getElementById("pdv-acai-tam").addEventListener("change", syncAcaiValor);
    document.getElementById("pdv-acai-qtd").addEventListener("input", syncAcaiValor);
    syncAcaiValor();
    document.getElementById("pdv-add-acai").onclick = () => {
      const t = tamanhosAcai.find(x => x.id === Number(document.getElementById("pdv-acai-tam").value));
      const qtd = Number(document.getElementById("pdv-acai-qtd").value) || 0;
      const valor = Number(document.getElementById("pdv-acai-valor").value) || 0;
      if (!t || qtd <= 0) { showToast("Informe a quantidade", "err"); return; }
      const mlConsumido = t.ml * qtd;
      if (produto && mlConsumido > produto.estoqueAtual) {
        showToast(`Atenção: estoque de açaí é ${formatEstoqueValor(produto.estoqueAtual, "acai")}, venda segue mas confira o estoque.`, "err");
      }
      state.cart.push({ produtoId: produto ? produto.id : null, categoria: "acai", nome: `Açaí ${t.nome}`, quantidade: qtd, estoqueDelta: mlConsumido, precoUnit: valor / qtd, subtotal: valor });
      renderPdvCart();
      showToast("Item adicionado");
    };
    return;
  }

  if (cat === "salgado" || cat === "pacote") {
    const produto = cat === "salgado" ? getProdutoSalgados(produtos) : produtos.find(p => p.categoria === cat);
    wrap.innerHTML = `
      <p class="small muted">${cat === "salgado" ? "Estoque único de salgados (fritos + congelados)" : "Estoque atual"}: <b>${produto ? produto.estoqueAtual : 0}</b> ${produto ? produto.unidade : ""}
        ${produto && produto.sabores ? `<br>Sabores de referência: ${escapeHtml(produto.sabores)}` : ""}</p>
      <div class="field-row">
        <div class="field" style="max-width:140px;"><label>Quantidade</label><input id="pdv-qtd" type="number" min="1" value="1"></div>
        <div class="field" style="max-width:140px;"><label>Valor total (R$)</label><input id="pdv-valor" type="number" min="0" step="0.01"></div>
      </div>
      <button class="btn btn-accent" id="pdv-add-simples">Adicionar à venda</button>
    `;
    document.getElementById("pdv-qtd").addEventListener("input", () => {
      const qtd = Number(document.getElementById("pdv-qtd").value) || 0;
      if (produto && produto.precoVenda) document.getElementById("pdv-valor").value = (qtd * produto.precoVenda).toFixed(2);
    });
    document.getElementById("pdv-add-simples").onclick = () => {
      const qtd = Number(document.getElementById("pdv-qtd").value) || 0;
      const valor = Number(document.getElementById("pdv-valor").value) || 0;
      if (qtd <= 0) { showToast("Informe a quantidade", "err"); return; }
      if (produto && produto.estoqueAtual !== null && qtd > produto.estoqueAtual) showToast(`Atenção: estoque é ${produto.estoqueAtual}, venda segue mas confira o estoque.`, "err");
      state.cart.push({ produtoId: produto ? produto.id : null, categoria: cat, nome: cat === "salgado" ? "Salgados fritos" : (produto ? produto.nome : CATEGORIA_LABEL[cat]), quantidade: qtd, precoUnit: valor / qtd, subtotal: valor });
      renderPdvCart();
      showToast("Item adicionado");
    };
    return;
  }

  // bebida / assado -> escolher item específico da lista
  const itens = produtos.filter(p => p.categoria === cat);
  wrap.innerHTML = `
    <div class="field-row">
      <div class="field"><label>Item</label>
        <select id="pdv-item-sel">${itens.map(p => `<option value="${p.id}">${escapeHtml(p.nome)}${p.estoqueAtual !== null ? " (estoque: " + p.estoqueAtual + ")" : ""}</option>`).join("")}</select>
      </div>
      <div class="field" style="max-width:110px;"><label>Qtd.</label><input id="pdv-item-qtd" type="number" min="1" value="1"></div>
      <div class="field" style="max-width:140px;"><label>Valor total (R$)</label><input id="pdv-item-valor" type="number" min="0" step="0.01"></div>
    </div>
    <button class="btn btn-accent" id="pdv-add-item">Adicionar à venda</button>
  `;
  function syncPrecoSugerido() {
    const p = itens.find(x => x.id === Number(document.getElementById("pdv-item-sel").value));
    const qtd = Number(document.getElementById("pdv-item-qtd").value) || 0;
    if (p && p.precoVenda) document.getElementById("pdv-item-valor").value = (qtd * p.precoVenda).toFixed(2);
  }
  document.getElementById("pdv-item-sel").addEventListener("change", syncPrecoSugerido);
  document.getElementById("pdv-item-qtd").addEventListener("input", syncPrecoSugerido);
  syncPrecoSugerido();
  document.getElementById("pdv-add-item").onclick = () => {
    const p = itens.find(x => x.id === Number(document.getElementById("pdv-item-sel").value));
    const qtd = Number(document.getElementById("pdv-item-qtd").value) || 0;
    const valor = Number(document.getElementById("pdv-item-valor").value) || 0;
    if (!p || qtd <= 0) { showToast("Informe a quantidade", "err"); return; }
    if (p.estoqueAtual !== null && qtd > p.estoqueAtual) {
      showToast(`Atenção: estoque de ${p.nome} é ${p.estoqueAtual}, venda segue mas confira o estoque.`, "err");
    }
    state.cart.push({ produtoId: p.id, categoria: cat, nome: p.nome, quantidade: qtd, precoUnit: valor / qtd, subtotal: valor });
    renderPdvCart();
    showToast("Item adicionado");
  };
}

function renderPdvCart() {
  const wrap = document.getElementById("pdv-cart");
  if (!wrap) return;
  const total = state.cart.reduce((s, i) => s + i.subtotal, 0);
  const pg = state.pdvPagamento;
  wrap.innerHTML = `
    <h3>Itens desta venda</h3>
    ${state.cart.length === 0 ? `<p class="empty-state">Nenhum item adicionado ainda.</p>` : state.cart.map((item, idx) => `
      <div class="cart-item">
        <div>
          <div class="desc">${escapeHtml(item.nome)}</div>
          <div class="sub">${item.quantidade} ${CATEGORIA_LABEL[item.categoria] || ""} · ${fmtMoney(item.precoUnit)} cada</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <b>${fmtMoney(item.subtotal)}</b>
          <button class="btn-ghost" data-idx="${idx}" title="Remover">✕</button>
        </div>
      </div>
    `).join("")}
    <div class="cart-total"><span>Total</span><span>${fmtMoney(total)}</span></div>
    ${state.cart.length > 0 ? `
    <div class="field-row" style="align-items:flex-end;">
      <div class="field"><label>Forma de pagamento</label>
        <select id="pdv-forma-pagamento">
          ${FORMAS_PAGAMENTO.map(f => `<option value="${f.value}" ${pg.forma === f.value ? "selected" : ""}>${f.label}</option>`).join("")}
        </select>
      </div>
      ${pg.forma === "credito_parcelado" ? `<div class="field" style="max-width:120px;"><label>Parcelas</label><input type="number" id="pdv-parcelas" min="2" value="${pg.parcelas || 2}"></div>` : ""}
    </div>` : ""}
    <button class="btn btn-primary btn-block btn-lg" id="pdv-finalizar" ${state.cart.length === 0 ? "disabled" : ""}>Finalizar Venda</button>
  `;
  wrap.querySelectorAll("button[data-idx]").forEach(btn => {
    btn.onclick = () => { state.cart.splice(Number(btn.dataset.idx), 1); renderPdvCart(); };
  });
  const formaSel = document.getElementById("pdv-forma-pagamento");
  if (formaSel) formaSel.addEventListener("change", (e) => { state.pdvPagamento.forma = e.target.value; renderPdvCart(); });
  const parcelasInp = document.getElementById("pdv-parcelas");
  if (parcelasInp) parcelasInp.addEventListener("input", (e) => { state.pdvPagamento.parcelas = Number(e.target.value) || 2; });
  const finalizar = document.getElementById("pdv-finalizar");
  if (finalizar) finalizar.onclick = finalizarVenda;
}

async function finalizarVenda() {
  if (state.cart.length === 0) return;
  const total = state.cart.reduce((s, i) => s + i.subtotal, 0);
  const pg = state.pdvPagamento;
  const venda = {
    dataHora: todayISO(),
    itens: state.cart,
    total,
    usuarioId: state.user.id,
    usuarioNome: state.user.nome,
    formaPagamento: pg.forma,
    parcelas: pg.forma === "credito_parcelado" ? (pg.parcelas || 2) : null
  };
  const vendaId = await dbPut("vendas", venda);

  // baixa automática de estoque + registro no livro de movimentação (kardex)
  for (const item of state.cart) {
    let produto = item.produtoId ? await dbGet("produtos", item.produtoId) : null;
    const delta = item.estoqueDelta != null ? item.estoqueDelta : item.quantidade;
    const estoqueAntes = (produto && produto.estoqueAtual !== null) ? produto.estoqueAtual : null;
    let estoqueDepois = null;
    if (produto && produto.estoqueAtual !== null) {
      produto.estoqueAtual = Math.max(0, produto.estoqueAtual - delta);
      estoqueDepois = produto.estoqueAtual;
      await dbPut("produtos", produto);
    }
    await logMovimento({
      produtoId: item.produtoId, produtoNome: item.nome, categoria: item.categoria,
      tipo: "venda", quantidade: estoqueAntes != null ? delta : item.quantidade, unidade: produto ? produto.unidade : "",
      valorUnitario: item.precoUnit, valorTotal: item.subtotal,
      estoqueAntes, estoqueDepois,
      formaPagamento: pg.forma, parcelas: venda.parcelas
    });
  }

  state.cart = [];
  state.pdvCategoria = null;
  state.pdvPagamento = { forma: "dinheiro", parcelas: 2 };
  showToast(`Venda de ${fmtMoney(total)} registrada!`);
  renderPDV();
}

/* ---------------------------------------------------------------------
   Histórico de vendas
--------------------------------------------------------------------- */
async function renderHistorico() {
  const el = document.getElementById("main-content");
  if (!state.hist) state.hist = { mode: "dia", date: new Date().toISOString().slice(0, 10), dataIni: "", dataFim: "" };
  el.innerHTML = `
    <div class="card">
      <h2 class="mt-0">Histórico de Vendas</h2>
      <div class="hist-filter-row">
        <div class="hist-mode-toggle">
          <button class="btn-toggle ${state.hist.mode === "dia" ? "active" : ""}" data-mode="dia">Dia</button>
          <button class="btn-toggle ${state.hist.mode === "periodo" ? "active" : ""}" data-mode="periodo">Período</button>
          <button class="btn-toggle ${state.hist.mode === "todas" ? "active" : ""}" data-mode="todas">Tudo</button>
        </div>
        <div id="hist-filter-controls"></div>
      </div>
      <div id="hist-list" style="margin-top:10px;"></div>
    </div>
  `;
  document.querySelectorAll(".btn-toggle[data-mode]").forEach(btn => {
    btn.onclick = () => { state.hist.mode = btn.dataset.mode; renderHistorico(); };
  });
  renderHistFilterControls();
  await drawHistorico();
}

function renderHistFilterControls() {
  const wrap = document.getElementById("hist-filter-controls");
  if (state.hist.mode === "dia") {
    wrap.innerHTML = `
      <button class="btn btn-secondary" id="hist-prev" title="Dia anterior">←</button>
      <input type="date" id="hist-date" value="${state.hist.date}">
      <button class="btn btn-secondary" id="hist-next" title="Próximo dia">→</button>
      <button class="btn-ghost" id="hist-today">Hoje</button>
    `;
    document.getElementById("hist-prev").onclick = () => shiftHistDate(-1);
    document.getElementById("hist-next").onclick = () => shiftHistDate(1);
    document.getElementById("hist-today").onclick = () => { state.hist.date = new Date().toISOString().slice(0, 10); renderHistFilterControls(); drawHistorico(); };
    document.getElementById("hist-date").addEventListener("change", (e) => { state.hist.date = e.target.value; drawHistorico(); });
  } else if (state.hist.mode === "periodo") {
    wrap.innerHTML = `
      <input type="date" id="hist-ini" value="${state.hist.dataIni}">
      <span class="muted small">até</span>
      <input type="date" id="hist-fim" value="${state.hist.dataFim}">
      <button class="btn btn-secondary" id="hist-aplicar">Aplicar</button>
    `;
    document.getElementById("hist-aplicar").onclick = () => {
      state.hist.dataIni = document.getElementById("hist-ini").value;
      state.hist.dataFim = document.getElementById("hist-fim").value;
      drawHistorico();
    };
  } else {
    wrap.innerHTML = `<span class="muted small">Mostrando todas as vendas registradas</span>`;
  }
}

function shiftHistDate(delta) {
  const d = new Date(state.hist.date + "T00:00:00");
  d.setDate(d.getDate() + delta);
  state.hist.date = d.toISOString().slice(0, 10);
  renderHistFilterControls();
  drawHistorico();
}

async function drawHistorico() {
  const vendas = (await dbGetAll("vendas")).sort((a, b) => new Date(b.dataHora) - new Date(a.dataHora));
  let lista = vendas;
  if (state.hist.mode === "dia") {
    lista = vendas.filter(v => v.dataHora.slice(0, 10) === state.hist.date);
  } else if (state.hist.mode === "periodo" && state.hist.dataIni && state.hist.dataFim) {
    lista = vendas.filter(v => { const d = v.dataHora.slice(0, 10); return d >= state.hist.dataIni && d <= state.hist.dataFim; });
  }
  const total = lista.reduce((s, v) => s + v.total, 0);

  document.getElementById("hist-list").innerHTML = `
    <p class="muted">${lista.length} venda(s) · Total: <b>${fmtMoney(total)}</b></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Data/Hora</th><th>Itens</th><th>Pagamento</th><th>Lançado por</th><th class="num">Total</th></tr></thead>
      <tbody>${lista.slice(0, 300).map(v => `
        <tr>
          <td>${fmtDateTime(v.dataHora)}</td>
          <td>${v.itens.map(i => `${i.quantidade}x ${escapeHtml(i.nome)}`).join(", ")}</td>
          <td>${formaPagamentoLabel(v)}</td>
          <td>${escapeHtml(v.usuarioNome)}</td>
          <td class="num">${fmtMoney(v.total)}</td>
        </tr>`).join("")}</tbody>
    </table></div>
    ${lista.length === 0 ? `<p class="empty-state">Nenhuma venda encontrada.</p>` : ""}
  `;
}

    </div>
    <div class="card">
      <h2 class="mt-0">Estoque atual</h2>

    </div>
  `;
  document.getElementById("gr-aplicar").onclick = () => {
    state.graficos.dataIni = document.getElementById("gr-ini").value;
    state.graficos.dataFim = document.getElementById("gr-fim").value;
    drawGraficos();
  };

async function drawGraficos() {
  const { dataIni, dataFim } = state.graficos;
  const vendas = (await dbGetAll("vendas")).filter(v => { const d = v.dataHora.slice(0, 10); return d >= dataIni && d <= dataFim; });

  const porDia = {};
  const porDiaQtd = {};
  vendas.forEach(v => {
    const d = v.dataHora.slice(0, 10);
    porDia[d] = (porDia[d] || 0) + v.total;
    porDiaQtd[d] = (porDiaQtd[d] || 0) + v.itens.reduce((s, i) => s + (Number(i.quantidade) || 0), 0);
  });
  const dias = Array.from(new Set([...Object.keys(porDia), ...Object.keys(porDiaQtd)])).sort();
  renderDailySalesChart(document.getElementById("gr-vendas-chart"), dias.map(d => ({ label: fmtDate(d).slice(0, 5), value: porDia[d] || 0 })));
  renderDailySalesChart(document.getElementById("gr-vendas-qtd-chart"), dias.map(d => ({ label: fmtDate(d).slice(0, 5), value: porDiaQtd[d] || 0 })), v => v + " item(ns)");

  const porForma = {};
  vendas.forEach(v => { const f = v.formaPagamento || "nao_informado"; porForma[f] = (porForma[f] || 0) + v.total; });
  const mapForma = { ...FORMA_PAGAMENTO_MAP, nao_informado: "Não informado" };
  const formaItens = Object.entries(porForma).map(([k, v]) => ({ nome: mapForma[k] || k, estoqueAtual: v, estoqueMinimo: null, unidade: "" }));
  if (formaItens.length === 0) {
    document.getElementById("gr-forma-chart").innerHTML = `<p class="empty-state">Sem vendas no período.</p>`;
  } else {
    renderStockBarChart(document.getElementById("gr-forma-chart"), formaItens, v => fmtMoney(v));
  }

  const produtos = await dbGetAll("produtos");
  const categorias = ["salgado", "pacote", "bebida"];
  const estoqueEl = document.getElementById("gr-estoque");
  estoqueEl.innerHTML = categorias.map(cat => `<h3>${CATEGORIA_ESTOQUE_LABEL[cat]}</h3><div id="gr-chart-${cat}"></div>`).join("");
  categorias.forEach(cat => {
    const chartEl = document.getElementById("gr-chart-" + cat);
    const itens = produtos.filter(p => p.categoria === cat && !p.mergedInto);
    if (itens.some(p => p.estoqueAtual !== null)) renderStockBarChart(chartEl, itens);
    else chartEl.innerHTML = `<p class="empty-state small">Sem estoque controlado nesta categoria.</p>`;
  });
}

async function renderFinanceiro() {
  const el = document.getElementById("main-content");
  const mk = monthKey(new Date());
  el.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <h2 class="mt-0 mb-0">Balancete</h2>
        <input type="month" id="fin-mes" value="${mk}" class="field" style="width:auto;padding:8px;">
      </div>
      <div id="fin-content"></div>
    </div>
  `;
  document.getElementById("fin-mes").addEventListener("change", (e) => drawFinanceiro(e.target.value || mk));
  drawFinanceiro(mk);
}

async function drawFinanceiro(mk) {
  const content = document.getElementById("fin-content");
  const vendas = (await dbGetAll("vendas")).filter(v => monthKey(v.dataHora) === mk);
  const totalVendas = vendas.reduce((s, v) => s + v.total, 0);
  const contas = (await dbGetAll("contasFixas")).filter(c => c.mes === mk);
  const totalContas = contas.reduce((s, c) => s + c.valor, 0);
  const meta = (await dbGet("balancetesMeta", mk)) || { mes: mk, dinheiroEmCaixa: 0 };
  const fechamento = totalVendas - totalContas;
  const diferenca = meta.dinheiroEmCaixa - fechamento;

  // agrupar vendas por dia
  const porDia = {};
  vendas.forEach(v => {
    const d = v.dataHora.slice(0, 10);
    porDia[d] = (porDia[d] || 0) + v.total;

async function getMovimentosFiltrados() {
  const { dataIni, dataFim, tipo } = state.relatorio;
  let movimentos = (await dbGetAll("movimentosEstoque")).filter(m => {
    const d = m.data.slice(0, 10);
    return d >= dataIni && d <= dataFim;
  });
  if (tipo && tipo !== "todos") movimentos = movimentos.filter(m => m.tipo === tipo);
  movimentos.sort((a, b) => new Date(a.data) - new Date(b.data));
  return movimentos;
}

async function drawRelatorio() {
  const content = document.getElementById("rel-content");
  const movimentos = await getMovimentosFiltrados();

  const totais = { venda: 0, compra: 0, perda: 0 };
  movimentos.forEach(m => { if (m.valorTotal != null) totais[m.tipo] = (totais[m.tipo] || 0) + m.valorTotal; });
  document.getElementById("rel-resumo").innerHTML =
    `${movimentos.length} movimento(s) · Vendas: <b>${fmtMoney(totais.venda)}</b> · Compras: <b>${fmtMoney(totais.compra)}</b> · Perdas: <b>${fmtMoney(totais.perda)}</b>`;

  content.innerHTML = `
    <div class="card">
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Data/Hora</th><th>Item</th><th>Categoria</th><th>Tipo</th>
          <th class="num">Qtd.</th><th class="num">Valor unit.</th><th class="num">Valor total</th>
          <th class="num">Estoque antes</th><th class="num">Estoque depois</th>
          <th>Pagamento/Motivo</th><th>Lançado por</th>
        </tr></thead>
        <tbody>${movimentos.slice(0, 500).map(m => `
          <tr>
            <td>${fmtDateTime(m.data)}</td>
            <td>${escapeHtml(m.produtoNome)}</td>

            <td><span class="badge ${m.tipo === "venda" ? "badge-ok" : m.tipo === "perda" ? "badge-low" : "badge-func"}">${TIPO_MOVIMENTO_LABEL[m.tipo] || m.tipo}</span></td>
            <td class="num">${m.quantidade} ${escapeHtml(m.unidade || "")}</td>
            <td class="num">${m.valorUnitario == null ? "—" : fmtMoney(m.valorUnitario)}</td>
            <td class="num">${m.valorTotal == null ? "—" : fmtMoney(m.valorTotal)}</td>
            <td class="num">${formatEstoqueValor(m.estoqueAntes, m.categoria)}</td>
            <td class="num">${formatEstoqueValor(m.estoqueDepois, m.categoria)}</td>
            <td>${m.tipo === "venda" ? formaPagamentoLabel(m) : (m.motivo ? escapeHtml(m.motivo) : "—")}</td>
            <td>${escapeHtml(m.usuarioNome || "—")}</td>
          </tr>`).join("")}</tbody>
      </table></div>
      ${movimentos.length === 0 ? `<p class="empty-state">Nenhum movimento no período/filtro selecionado.</p>` : ""}
      ${movimentos.length > 500 ? `<p class="small muted">Mostrando as primeiras 500 linhas na tela — o Excel exportado traz todas.</p>` : ""}
    </div>
  `;
}

async function exportRelatorioExcel() {
  if (typeof XLSX === "undefined") { showToast("Não foi possível carregar o gerador de Excel.", "err"); return; }
  const movimentos = await getMovimentosFiltrados();
  if (movimentos.length === 0) { showToast("Nenhum movimento no período selecionado.", "err"); return; }

  const linhas = movimentos.map(m => ({
    "Data": fmtDate(m.data),
    "Hora": new Date(m.data).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    "Item": m.produtoNome,
    "Categoria": CATEGORIA_LABEL[m.categoria] || m.categoria || "",
    "Tipo": TIPO_MOVIMENTO_LABEL[m.tipo] || m.tipo,
    "Quantidade": m.quantidade,
    "Unidade": m.unidade || "",
    "Valor unitário (R$)": m.valorUnitario != null ? Number(m.valorUnitario.toFixed(2)) : "",
    "Valor total (R$)": m.valorTotal != null ? Number(m.valorTotal.toFixed(2)) : "",
    "Estoque antes": m.estoqueAntes != null ? formatEstoqueValor(m.estoqueAntes, m.categoria) : "",
    "Estoque depois": m.estoqueDepois != null ? formatEstoqueValor(m.estoqueDepois, m.categoria) : "",
    "Forma de pagamento": m.tipo === "venda" ? (FORMA_PAGAMENTO_MAP[m.formaPagamento] || "") + (m.parcelas ? ` (${m.parcelas}x)` : "") : "",
    "Motivo da perda": (m.tipo === "perda" || m.tipo === "ajuste") ? (m.motivo || "") : "",
    "Lançado por": m.usuarioNome || ""
  }));

  const ws = XLSX.utils.json_to_sheet(linhas);
  ws["!cols"] = [
    { wch: 10 }, { wch: 7 }, { wch: 26 }, { wch: 16 }, { wch: 10 },
    { wch: 10 }, { wch: 9 }, { wch: 16 }, { wch: 15 }, { wch: 13 }, { wch: 14 },
    { wch: 22 }, { wch: 18 }, { wch: 16 }
  ];
  const range = XLSX.utils.decode_range(ws["!ref"]);
  ws["!autofilter"] = { ref: XLSX.utils.encode_range(range) };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Movimentação");

  // Segunda aba: vendas por dia (quantidade de itens e valor faturado), mesmo período do relatório.
  const { dataIni, dataFim } = state.relatorio;
  const vendasPeriodo = (await dbGetAll("vendas")).filter(v => {
    const d = v.dataHora.slice(0, 10);
    return d >= dataIni && d <= dataFim;
  });
  const porDia = {};
  vendasPeriodo.forEach(v => {
    const d = v.dataHora.slice(0, 10);
    if (!porDia[d]) porDia[d] = { qtd: 0, valor: 0, vendas: 0 };
    porDia[d].qtd += v.itens.reduce((s, i) => s + (Number(i.quantidade) || 0), 0);
    porDia[d].valor += v.total;
    porDia[d].vendas += 1;
  });
  const diasOrdenados = Object.keys(porDia).sort();
  const linhasPorDia = diasOrdenados.map(d => ({
    "Data": fmtDate(d),
    "Qtd. de vendas": porDia[d].vendas,
    "Qtd. de itens vendidos": porDia[d].qtd,
    "Valor faturado (R$)": Number(porDia[d].valor.toFixed(2))
  }));
  if (linhasPorDia.length > 0) {
    linhasPorDia.push({
      "Data": "TOTAL",
      "Qtd. de vendas": diasOrdenados.reduce((s, d) => s + porDia[d].vendas, 0),
      "Qtd. de itens vendidos": diasOrdenados.reduce((s, d) => s + porDia[d].qtd, 0),
      "Valor faturado (R$)": Number(diasOrdenados.reduce((s, d) => s + porDia[d].valor, 0).toFixed(2))
    });
    const wsDia = XLSX.utils.json_to_sheet(linhasPorDia);
    wsDia["!cols"] = [{ wch: 12 }, { wch: 14 }, { wch: 20 }, { wch: 18 }];
    XLSX.utils.book_append_sheet(wb, wsDia, "Vendas por Dia");
  }

  const nomeArquivo = `gama-chips-movimentacao-${dataIni}_a_${dataFim}.xlsx`;
  XLSX.writeFile(wb, nomeArquivo);
  showToast("Excel exportado!");
}

    u.nome = nome;
    u.perfil = document.getElementById("eu-perfil").value;
    await dbPut("usuarios", u);
    closeModal();
    showToast("Usuário salvo");
    renderUsuarios();
  };
}

function openTrocarMinhaSenhaModal() {
  openModal(`
    <h2>Trocar minha senha</h2>
    <div class="field"><label>Senha atual</label><input type="password" id="ms-atual"></div>
    <div class="field"><label>Nova senha</label><input type="password" id="ms-nova" placeholder="10+ caracteres, maiúscula, minúscula e número"></div>
    <div class="modal-actions"><button class="btn btn-secondary" id="ms-cancel">Cancelar</button><button class="btn btn-primary" id="ms-ok">Trocar</button></div>
  `);
  document.getElementById("ms-cancel").onclick = closeModal;
  document.getElementById("ms-ok").onclick = async () => {
    const atual = document.getElementById("ms-atual").value, nova = document.getElementById("ms-nova").value;
    if (nova.length < 10) { showToast("A nova senha precisa ter no mínimo 10 caracteres, com maiúscula, minúscula e número", "err"); return; }
    try {
      const u = fbAuth.currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, atual));
      await u.updatePassword(nova);
      closeModal(); showToast("Senha trocada!");
    } catch (err) { showToast(err.code === "auth/password-does-not-meet-requirements" ? "Senha nova fora da política (10+, maiúscula, minúscula e número)" : "Senha atual incorreta", "err"); }
  };
}

/* ---------------------------------------------------------------------
   Backup (admin)
--------------------------------------------------------------------- */
async function renderBackup() {
  const el = document.getElementById("main-content");
  const produtos = await dbGetAll("produtos");
  const vendas = await dbGetAll("vendas");
  el.innerHTML = `
    <div class="card">
      <h2>Backup dos dados</h2>
      <p class="muted">Os dados ficam salvos na nuvem (Firebase) e aparecem em qualquer computador ou celular que entrar no sistema.
      Mesmo assim, vale exportar uma cópia de vez em quando. Pra trazer os dados da versão antiga (offline ou do link),
      use o <b>Importar</b> ou cole o texto no campo abaixo.</p>
      <p class="small muted">Hoje existem <b>${produtos.length}</b> itens cadastrados e <b>${vendas.length}</b> vendas registradas.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
        <button class="btn btn-primary" id="bk-export">Exportar backup (.json)</button>
        <label class="btn btn-secondary" style="margin:0;">Importar backup
          <input type="file" id="bk-import" accept=".json,.txt" style="display:none;">
        </label>
      </div>
    </div>
    <div class="card">
      <h2>Backup em texto (copiar e colar)</h2>
      <p class="muted">Use quando o download não funcionar (ex.: abrindo o sistema por um link).
      Clique em <b>Gerar e copiar backup</b>, depois cole o texto num WhatsApp, e-mail ou Bloco de Notas e guarde.
      Pra restaurar (ou passar os dados pra outro computador), cole o texto no campo e clique em <b>Importar texto colado</b>.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;">
        <button class="btn btn-accent" id="bk-copy">Gerar e copiar backup</button>
        <button class="btn btn-secondary" id="bk-paste-import">Importar texto colado</button>
      </div>
      <div class="field mb-0"><textarea id="bk-text" rows="8" style="font-family:monospace;font-size:12px;" placeholder="O backup aparece aqui (ou cole aqui um backup pra importar)"></textarea></div>
      <p class="small muted" id="bk-text-info"></p>
    </div>
  `;
  document.getElementById("bk-copy").onclick = copyBackupTexto;
  document.getElementById("bk-paste-import").onclick = () => {
    const txt = document.getElementById("bk-text").value.trim();
    if (!txt) { showToast("Cole o texto do backup no campo primeiro", "err"); return; }
    importBackupTexto(txt);
  };
  document.getElementById("bk-export").onclick = exportBackup;
  document.getElementById("bk-import").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) importBackup(file);
  });
}

async function buildBackupData() {
  const data = {};
  for (const store of STORES) data[store] = await dbGetAll(store);
  data._exportadoEm = todayISO();
  data._sistema = "gama-chips";
  return data;
}

async function copyBackupTexto() {
  const data = await buildBackupData();
  const txt = JSON.stringify(data);
  const ta = document.getElementById("bk-text");
  ta.value = txt;
  ta.focus();
  ta.select();
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
  if (!ok) { try { ok = document.execCommand("copy"); } catch (e) {} }
  document.getElementById("bk-text-info").textContent =
    `${(data.vendas || []).length} vendas, ${(data.produtos || []).length} itens · ${(txt.length / 1024).toFixed(0)} KB de texto.` +
    (ok ? " Copiado! Agora é só colar onde quiser guardar." : " Não deu pra copiar automático: o texto já está selecionado, aperte Ctrl+C.");
  showToast(ok ? "Backup copiado!" : "Aperte Ctrl+C pra copiar", ok ? "ok" : "err");
}

async function aplicarBackup(data) {
  if (!data || typeof data !== "object" || !Array.isArray(data.produtos)) throw new Error("não parece um backup do Gama Chips");
  showToast("Importando... não feche a página.");
  for (const store of STORES) {
    if (store === "usuarios") continue; // usuários online são do Firebase Auth
    if (!Array.isArray(data[store])) continue;
    await dbClear(store);
    await dbBulkPut(store, data[store]);
  }
}

function importBackupTexto(txt) {
  confirmDialog("Importar este backup vai SUBSTITUIR todos os dados atuais. Tem certeza?", async () => {
    try {
      await aplicarBackup(JSON.parse(txt));
      showToast("Backup importado com sucesso! Recarregando...");
      setTimeout(() => location.reload(), 1200);
    } catch (err) {
      showToast("Texto inválido: " + err.message, "err");
    }
  });
}

async function exportBackup() {
  const data = await buildBackupData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dataStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `gama-chips-backup-${dataStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("Backup exportado! Se nenhum arquivo apareceu nos Downloads, use o \"Gerar e copiar backup\" abaixo.");
}

function importBackup(file) {
  confirmDialog("Importar este backup vai SUBSTITUIR todos os dados atuais. Tem certeza?", () => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        await aplicarBackup(JSON.parse(e.target.result));
        showToast("Backup importado com sucesso! Recarregando...");
        setTimeout(() => location.reload(), 1200);
      } catch (err) {
        showToast("Arquivo inválido: " + err.message, "err");
      }
    };
    reader.readAsText(file);
  });
}
